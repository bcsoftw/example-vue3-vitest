# example GitHub Actions workflow file for a CI/CD pipeline
name: CI Pipeline Vue3
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'


      - name: Install dependencies
        run: npm ci


      - name: Build project
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist


      
      
      